<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>資金分配滑桿</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            text-align: center;
        }
        h2 { margin-bottom: 10px; }
        input[type="range"] {
            width: 100%;
            margin: 20px 0;
        }
        #valDisplay {
            font-size: 32px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #0088cc);
        }
        .info {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h2>選擇進場資金比例</h2>
    <div id="valDisplay">50%</div>
    <input type="range" id="percentSlider" min="1" max="100" value="50">
    <div class="info">拖動滑桿選擇比例，按確認後送出</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const slider = document.getElementById("percentSlider");
        const display = document.getElementById("valDisplay");

        slider.oninput = function() {
            display.innerHTML = this.value + "%";
        }

        tg.MainButton.text = "確認送出單子";
        tg.MainButton.show();

        tg.onEvent('mainButtonClicked', function() {
            const finalPercent = slider.value;
            tg.sendData(finalPercent);
            tg.close();
        });

        tg.ready();
    </script>
</body>
</html>
