<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>開倉位</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #fff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .header .balance {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #888);
        }
        .slider-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .percent-display {
            text-align: center;
            font-size: 64px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #4ade80);
            margin-bottom: 20px;
        }
        .percent-display span {
            font-size: 32px;
            color: var(--tg-theme-hint-color, #888);
        }
        input[type="range"] {
            width: 100%;
            height: 12px;
            border-radius: 6px;
            background: var(--tg-theme-secondary-bg-color, #0f3460);
            outline: none;
            -webkit-appearance: none;
            margin: 20px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--tg-theme-button-color, #4ade80);
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(74, 222, 128, 0.4);
        }
        .quick-btns {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .quick-btns button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #0f3460);
            color: var(--tg-theme-text-color, #fff);
            font-size: 16px;
            cursor: pointer;
        }
        .quick-btns button.active {
            background: var(--tg-theme-button-color, #4ade80);
            color: #000;
        }
        .preview {
            background: var(--tg-theme-secondary-bg-color, #0f3460);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .preview .label {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #888);
            margin-bottom: 8px;
        }
        .preview .amount {
            font-size: 24px;
            font-weight: bold;
            color: var(--tg-theme-text-color, #fff);
        }
        .preview .btc {
            font-size: 16px;
            color: var(--tg-theme-hint-color, #888);
            margin-top: 4px;
        }
        .timer-bar {
            height: 4px;
            background: var(--tg-theme-secondary-bg-color, #0f3460);
            border-radius: 2px;
            overflow: hidden;
            margin-top: auto;
        }
        .timer-bar .progress {
            height: 100%;
            background: var(--tg-theme-button-color, #4ade80);
            width: 100%;
            transition: width 1s linear;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>📊 開倉位</h2>
        <div class="balance" id="balance">可用: $0 USD</div>
        <div id="debugUrl" style="color: red; font-size: 12px; word-break: break-all;"></div>
    </div>

    <div class="slider-container">
        <div class="percent-display"><span id="percent">50</span><span>%</span></div>
        <input type="range" id="slider" min="1" max="100" value="50">
        <div class="quick-btns">
            <button data-val="10">10%</button>
            <button data-val="25">25%</button>
            <button data-val="50">50%</button>
            <button data-val="100">100%</button>
        </div>
        <div class="preview">
            <div class="label">使用金額（USD）</div>
            <div class="amount" id="usdAmount">$0</div>
            <div class="btc" id="btcAmount">≈ 0 BTC</div>
        </div>
    </div>

    <div class="timer-bar">
        <div class="progress" id="timerProgress"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Debug：顯示收到的 URL 參數
        const rawSearch = window.location.search;
        document.getElementById("debugUrl").innerText = "收到網址參數: " + (rawSearch || "無參數");

        // 直接從 URL params 取（Bot 會把餘額放在 URL 參數裏）
        const urlParams = new URLSearchParams(rawSearch);

        // 取得 balance
        const balanceRaw = urlParams.get('balance');
        const balance = balanceRaw !== null && balanceRaw !== '' ? parseFloat(balanceRaw) : 1000;

        // 取得 price
        const priceRaw = urlParams.get('price');
        const price = priceRaw !== null && priceRaw !== '' ? parseFloat(priceRaw) : 81000;

        document.getElementById('balance').textContent = `可用: $${balance.toFixed(2)} USD`;

        const slider = document.getElementById('slider');
        const percentEl = document.getElementById('percent');
        const usdEl = document.getElementById('usdAmount');
        const btcEl = document.getElementById('btcAmount');
        const quickBtns = document.querySelectorAll('.quick-btns button');
        const timerProgress = document.getElementById('timerProgress');

        let remainingTime = 15;

        function updateDisplay(val) {
            slider.value = val;
            percentEl.textContent = val;

            quickBtns.forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.val) === parseInt(val));
            });

            const usd = balance * val / 100;
            const btc = usd / price;

            usdEl.textContent = `$${usd.toFixed(2)}`;
            btcEl.textContent = `≈ ${btc.toFixed(6)} BTC`;
        }

        slider.addEventListener('input', e => updateDisplay(e.target.value));

        quickBtns.forEach(btn => {
            btn.addEventListener('click', () => updateDisplay(btn.dataset.val));
        });

        // 15秒倒計時
        const timer = setInterval(() => {
            remainingTime--;
            timerProgress.style.width = (remainingTime / 15 * 100) + '%';
            
            if (remainingTime <= 0) {
                clearInterval(timer);
                tg.sendData('timeout');
                tg.close();
            }
        }, 1000);

        // Main Button
        tg.MainButton.text = '確認開倉';
        tg.MainButton.show();

        tg.onEvent('mainButtonClicked', () => {
            clearInterval(timer);
            const val = parseInt(slider.value);
            const usd = balance * val / 100;
            const btc = usd / price;
            
            const result = {
                percent: val,
                side: 'long',
                usd: usd,
                btc: btc
            };
            
            tg.sendData(JSON.stringify(result));
            tg.close();
        });

        tg.ready();
        updateDisplay(50);
    </script>
</body>
</html>
